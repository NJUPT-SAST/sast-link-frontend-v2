allowBuilds:
  '@parcel/watcher': true
  msw: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp
  - unrs-resolver

overrides:
  '@babel/core@<=7.29.0': 7.29.6
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
  # fast-uri/brace-expansion floors track the open dependabot alerts
  # (fast-uri ReDoS, brace-expansion ReDoS) — each bump is the first patched
  # release of the affected ranges, per major, so consumers requiring an
  # older major keep their API line.
  'fast-uri@<3.1.8': 3.1.8
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  handlebars: '>=4.7.9'
  # hono/postcss are pulled in via the shadcn CLI toolchain (dev-only) — pinned
  # past the latest advisories. js-yaml stays on 3.x (jest's @istanbuljs toolchain
  # requires the 3.x API; 5.x is breaking). uuid floors at the patched 11.x.
  'hono@<4.12.34': 4.13.1
  'js-yaml@<3.15.2': 3.15.2
  'postcss@<8.5.23': 8.5.26
  'uuid@<11.1.1': 11.1.1

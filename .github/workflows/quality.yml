name: Code Quality

# ============================================================================
# Code Quality & Security Checks
# ============================================================================
# Runs ESLint, TypeScript type checking, and security audits.
# This workflow works OUT-OF-THE-BOX without requiring any secrets.
# ============================================================================

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 20 reached EOL 2026-04-30; 22 is the current LTS line.
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: TypeScript type checking
        run: pnpm exec tsc --noEmit

      - name: Security audit
        run: pnpm audit --audit-level=critical

      # Informational only — updates land via Dependabot. `|| true` keeps it
      # green in every case so it never surfaces a misleading exit-1 annotation
      # on an otherwise passing job.
      - name: Check for outdated dependencies
        run: pnpm outdated || true

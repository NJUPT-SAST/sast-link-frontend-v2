name: Release

# ============================================================================
# GitHub Release Creation
# ============================================================================
# Creates a GitHub release when a version tag is pushed.
# Triggers on tags matching v* (e.g., v1.0.0, v2.1.0-beta).
#
# This workflow:
# 1. Runs quality checks and tests
# 2. Creates a draft GitHub release (changelog only — the static export built
#    in test.yml lacks the NEXT_PUBLIC_* build args, so deployable artifacts
#    come from the Docker registry via deploy.yml, not from this workflow)
# ============================================================================

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run quality checks first
  quality:
    name: Quality Check
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  # Run tests
  test:
    name: Test Suite
    uses: ./.github/workflows/test.yml
    # test.yml's nested job posts the coverage table to the PR (checks +
    # pull-requests). The workflow-level permissions cap the token at read, so
    # grant what that job needs here — the cap still covers every other job.
    permissions:
      contents: read
      pull-requests: write
      checks: write

  # Create the GitHub release
  create-release:
    name: Create Release
    needs: [quality, test]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # The `out/` build in test.yml runs without the NEXT_PUBLIC_* build args,
      # so it is not a deployable artifact — attaching it would hand users a
      # bundle with dead OAuth buttons (the exact failure deploy.yml's Verify
      # step guards against). Production artifacts live in the Tencent registry
      # (deploy.yml); this release exists to carry the changelog notes only.
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

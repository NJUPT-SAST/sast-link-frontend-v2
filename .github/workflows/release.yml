name: Release

# ============================================================================
# GitHub Release Creation
# ============================================================================
# Creates a GitHub release when a version tag is pushed.
# Triggers on tags matching v* (e.g., v1.0.0, v2.1.0-beta).
#
# This workflow:
# 1. Runs quality checks and tests
# 2. Creates a draft GitHub release with build artifacts
# ============================================================================

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run quality checks first
  quality:
    name: Quality Check
    uses: ./.github/workflows/quality.yml

  # Run tests
  test:
    name: Test Suite
    uses: ./.github/workflows/test.yml
    # test.yml's nested job posts the coverage table to the PR (checks +
    # pull-requests). The workflow-level permissions cap the token at read, so
    # grant what that job needs here — the cap still covers every other job.
    permissions:
      contents: read
      pull-requests: write
      checks: write

  # Create the GitHub release
  create-release:
    name: Create Release
    needs: [quality, test]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/nextjs-build/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

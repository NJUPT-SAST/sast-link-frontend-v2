services:
  sast-link-frontend-v2:
    image: ccr.ccs.tencentyun.com/sast/sast-link-frontend-v2:current
    build:
      context: .
      args:
        # /v2 keeps the container on the same-origin mode the cookie session
        # requires (the host Caddy proxies /v2/* to the backend). An absolute
        # cross-origin URL like http://localhost:8080 would break the cookie
        # bootstrap — see .env.example for the two modes.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/v2}
        NEXT_PUBLIC_FEISHU_CLIENT_ID: ${NEXT_PUBLIC_FEISHU_CLIENT_ID:-}
        NEXT_PUBLIC_FEISHU_BIND_REDIRECT_URI: ${NEXT_PUBLIC_FEISHU_BIND_REDIRECT_URI:-}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
        NEXT_PUBLIC_GITHUB_BIND_REDIRECT_URI: ${NEXT_PUBLIC_GITHUB_BIND_REDIRECT_URI:-}
    container_name: sast-link-frontend-v2
    ports:
      # Caddy runs on the host and reaches this container through this published
      # port, so the mapping is required. Bound to loopback rather than
      # 0.0.0.0 so the only public path in is Caddy (and therefore HTTPS).
      - "127.0.0.1:3002:80"
    restart: unless-stopped
    networks:
      - sast-link-v2
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      # Tightened from 30s so a deploy reaches `healthy` in seconds instead of
      # waiting out a full interval before the first probe even runs.
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sast-link-v2:
    # Shared bridge created out-of-band alongside the backend, so it must
    # outlive this stack. Caddy runs on the host and comes in through the
    # published port above, not over this network.
    external: true
